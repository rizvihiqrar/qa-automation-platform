<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testing money in software: quiz</title>
  <link rel="stylesheet" href="quiz.css">
  <script src="quiz.js" defer></script>
</head>
<body>
  <main class="wrap">
    <h1 id="title">Testing money in software: quiz</h1>
    <p class="lede" id="lede">Loading the questions.</p>

    <div class="card" id="intro" hidden>
      <label for="code">Your code (for example P1, given to you by the person running the pilot; no names)</label>
      <input id="code" type="text" maxlength="8" autocomplete="off" spellcheck="false">
      <p class="hint">Pick an answer for each question. You see at once whether it is right and why. Nothing is stored or sent: you copy one line at the end.</p>
    </div>

    <div id="questions"></div>

    <div class="card" id="results" hidden aria-live="polite">
      <h2 id="results-title">Your results</h2>
      <p id="total" class="total"></p>
      <ul id="by-objective"></ul>
      <p>Copy this line and send it to the person running the pilot:</p>
      <textarea id="summary" readonly rows="2"></textarea>
    </div>
    <button type="button" id="show-results" disabled>Show my results</button>
    <p class="hint" id="left"></p>
  </main>
</body>
</html>
