# Template: Run Jest unit tests and publish results
#
# Parameters:
#   publishResults  — whether to publish JUnit results to the Tests tab (default: true)
#   withCoverage    — whether to collect and publish a coverage report (default: false)
#
# Usage:
#   - template: .azure/templates/steps/run-tests.yml
#     parameters:
#       withCoverage: true

parameters:
  - name: publishResults
    type: boolean
    default: true
  - name: withCoverage
    type: boolean
    default: false

steps:
  # Run Jest; append --coverage flags when withCoverage is true.
  # jest-junit produces an XML report that PublishTestResults can ingest.
  - ${{ if parameters.withCoverage }}:
    - script: |
        npm test -- --ci \
          --reporters=default \
          --reporters=jest-junit \
          --coverage \
          --coverageReporters=text \
          --coverageReporters=cobertura
      displayName: 'Run unit tests with coverage'
      env:
        JEST_JUNIT_OUTPUT_DIR: test-results
        JEST_JUNIT_OUTPUT_NAME: junit.xml

  - ${{ if not(parameters.withCoverage) }}:
    - script: |
        npm test -- --ci \
          --reporters=default \
          --reporters=jest-junit
      displayName: 'Run unit tests'
      env:
        JEST_JUNIT_OUTPUT_DIR: test-results
        JEST_JUNIT_OUTPUT_NAME: junit.xml

  # Publish JUnit results to the Azure DevOps Tests tab.
  - ${{ if parameters.publishResults }}:
    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: 'test-results/junit.xml'
        failTaskOnFailedTests: true
      displayName: 'Publish test results'

  # Publish Cobertura coverage report (only when coverage was collected).
  - ${{ if parameters.withCoverage }}:
    - task: PublishCodeCoverageResults@2
      condition: always()
      inputs:
        summaryFileLocation: coverage/cobertura-coverage.xml
        failIfCoverageEmpty: false
      displayName: 'Publish coverage report'
