# Template: Validate a health endpoint after deployment
#
# Polls the /health endpoint up to maxAttempts times, waiting retryDelay
# seconds between attempts. Fails the pipeline step if the endpoint does
# not return HTTP 200 within the allowed window.
#
# This pattern is from the Pluralsight "Azure DevOps Pipelines" course —
# it's used in the postRouteTraffic lifecycle hook to confirm the
# deployment is healthy before marking it complete.
#
# Parameters:
#   healthUrl    — full URL including path  (required, no default)
#   maxAttempts  — how many times to poll  (default: 5)
#   retryDelay   — seconds between polls   (default: 10)
#
# Usage:
#   - template: .azure/templates/steps/health-check.yml
#     parameters:
#       healthUrl: 'https://staging.myapp.com/health'
#       maxAttempts: 5
#       retryDelay: 10

parameters:
  - name: healthUrl
    type: string
  - name: maxAttempts
    type: number
    default: 5
  - name: retryDelay
    type: number
    default: 10

steps:
  - script: |
      MAX_ATTEMPTS=${{ parameters.maxAttempts }}
      RETRY_DELAY=${{ parameters.retryDelay }}
      URL="${{ parameters.healthUrl }}"
      attempt=1

      echo "Health check: $URL"
      echo "Max attempts: $MAX_ATTEMPTS  |  Retry delay: ${RETRY_DELAY}s"

      until [ $attempt -gt $MAX_ATTEMPTS ]; do
        echo "--- Attempt $attempt / $MAX_ATTEMPTS ---"

        STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
          --max-time 10 "$URL")

        if [ "$STATUS" = "200" ]; then
          echo "Health check passed (HTTP $STATUS)"
          exit 0
        fi

        echo "Got HTTP $STATUS — retrying in ${RETRY_DELAY}s..."
        sleep $RETRY_DELAY
        attempt=$((attempt + 1))
      done

      echo "Health check FAILED after $MAX_ATTEMPTS attempts"
      exit 1
    displayName: 'Health check: ${{ parameters.healthUrl }}'
