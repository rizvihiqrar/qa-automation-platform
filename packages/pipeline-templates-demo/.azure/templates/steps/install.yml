# Template: Install Node.js and npm dependencies
#
# Parameters:
#   nodeVersion  — Node.js version spec (default: '20.x')
#
# Usage:
#   - template: .azure/templates/steps/install.yml
#     parameters:
#       nodeVersion: '20.x'

parameters:
  - name: nodeVersion
    type: string
    default: '20.x'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: ${{ parameters.nodeVersion }}
    displayName: 'Use Node ${{ parameters.nodeVersion }}'

  - script: npm ci
    displayName: 'Install dependencies (npm ci)'
