# Template: Deployment stage with lifecycle hooks
#
# Uses a 'deployment' job with the runOnce strategy — the most common
# production deployment pattern. Lifecycle hooks allow you to attach
# steps to distinct phases of the deployment:
#
#   preDeploy        → validate environment before touching anything
#   deploy           → the actual release steps
#   routeTraffic     → switch load balancer / DNS
#   postRouteTraffic → health check AFTER traffic is live
#   on.success       → notify on success
#   on.failure       → rollback or alert on failure
#
# Parameters:
#   stageName      — Azure DevOps stage identifier  (required)
#   displayName    — human-readable stage label     (required)
#   environment    — Azure DevOps Environment name  (required)
#   dependsOn      — stage(s) this stage depends on (required)
#   healthUrl      — URL to poll post-deploy        (required)
#   condition      — run condition expression       (default: succeeded())
#
# Usage:
#   stages:
#     - template: .azure/templates/stages/deploy-stage.yml
#       parameters:
#         stageName: DeployStaging
#         displayName: Deploy to Staging
#         environment: staging
#         dependsOn: [CI]
#         healthUrl: 'https://staging.myapp.com/health'

parameters:
  - name: stageName
    type: string
  - name: displayName
    type: string
  - name: environment
    type: string
  - name: dependsOn
    type: object
  - name: healthUrl
    type: string
  - name: condition
    type: string
    default: succeeded()

stages:
  - stage: ${{ parameters.stageName }}
    displayName: ${{ parameters.displayName }}
    dependsOn: ${{ parameters.dependsOn }}
    condition: ${{ parameters.condition }}

    jobs:
      # 'deployment' job type links this stage to an Azure DevOps Environment.
      # Add approval gates in Pipelines → Environments to require sign-off
      # before this stage starts.
      - deployment: Deploy
        displayName: 'Deploy to ${{ parameters.environment }}'
        environment: ${{ parameters.environment }}
        pool:
          vmImage: ubuntu-latest

        strategy:
          runOnce:
            # ── preDeploy: run checks before touching the environment ──────────
            preDeploy:
              steps:
                - template: ../steps/install.yml
                  parameters:
                    nodeVersion: '20.x'

                - script: echo "Pre-deploy checks passed for ${{ parameters.environment }}"
                  displayName: 'Pre-deploy validation'

            # ── deploy: the release itself ─────────────────────────────────────
            deploy:
              steps:
                - script: |
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "  Deploying to: ${{ parameters.environment }}"
                    echo "  Build:        $(Build.BuildNumber)"
                    echo "  Commit:       $(Build.SourceVersion)"
                    echo "  Triggered by: $(Build.RequestedFor)"
                    echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                    echo "Deploy complete (simulated)"
                  displayName: 'Deploy ${{ parameters.environment }}'

            # ── routeTraffic: switch traffic to the new release ────────────────
            routeTraffic:
              steps:
                - script: echo "Traffic routed to new release in ${{ parameters.environment }}"
                  displayName: 'Route traffic'

            # ── postRouteTraffic: validate after traffic is live ───────────────
            postRouteTraffic:
              steps:
                - template: ../steps/health-check.yml
                  parameters:
                    healthUrl: ${{ parameters.healthUrl }}
                    maxAttempts: 3
                    retryDelay: 5

            # ── on.success / on.failure: outcome handlers ──────────────────────
            on:
              success:
                steps:
                  - script: echo "Deployment to ${{ parameters.environment }} succeeded"
                    displayName: 'Notify: success'

              failure:
                steps:
                  - script: |
                      echo "Deployment to ${{ parameters.environment }} FAILED"
                      echo "Initiating rollback..."
                      echo "(Rollback simulated — point traffic back to previous release)"
                    displayName: 'Rollback: failure handler'
