# Template: Full CI job — lint + test + coverage
#
# Composes the three step templates into a single reusable job.
# Use this when a stage just needs the standard CI pass.
#
# Parameters:
#   nodeVersion   — Node.js version spec   (default: '20.x')
#   jobName       — name for the job       (default: 'CI')
#   withCoverage  — collect coverage       (default: true)
#
# Usage:
#   jobs:
#     - template: .azure/templates/jobs/ci-job.yml
#       parameters:
#         nodeVersion: '20.x'
#         withCoverage: true

parameters:
  - name: nodeVersion
    type: string
    default: '20.x'
  - name: jobName
    type: string
    default: CI
  - name: withCoverage
    type: boolean
    default: true

jobs:
  - job: ${{ parameters.jobName }}
    displayName: 'CI — Node ${{ parameters.nodeVersion }}'
    pool:
      vmImage: ubuntu-latest

    steps:
      - template: ../steps/install.yml
        parameters:
          nodeVersion: ${{ parameters.nodeVersion }}

      - template: ../steps/lint.yml

      - template: ../steps/run-tests.yml
        parameters:
          publishResults: true
          withCoverage: ${{ parameters.withCoverage }}

      # Upload coverage artifact so it survives across stages.
      - ${{ if parameters.withCoverage }}:
        - task: PublishPipelineArtifact@1
          condition: always()
          inputs:
            targetPath: coverage/
            artifactName: coverage-report
          displayName: 'Upload coverage artifact'
