# GitHub Actions — Reusable Workflow (equivalent of an Azure DevOps jobs template)
#
# This is the GitHub equivalent of .azure/templates/jobs/ci-job.yml.
# A reusable workflow is called by another workflow using `uses:` with
# workflow_call as the trigger.
#
# The calling workflow (ci-cd.yml) passes parameters via `with:` and
# this workflow runs as if it were inline — same runner pool, same secrets.
#
# GitHub reusable workflow docs:
#   https://docs.github.com/en/actions/using-workflows/reusing-workflows

name: Reusable CI

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '20'
      upload-coverage:
        required: false
        type: boolean
        default: false

jobs:
  ci:
    name: CI (Node ${{ inputs.node-version }})
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node ${{ inputs.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci

      - name: Upload coverage
        if: inputs.upload-coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
