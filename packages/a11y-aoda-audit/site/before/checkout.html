<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkout | Maple Outfitters</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 24px; color: #222; background: #fff; }
    form { display: grid; gap: 12px; max-width: 360px; }
    input { padding: 8px; border: 1px solid #888; }
    .hint { color: #a6a6a6; font-size: 13px; }
    button { padding: 10px; background: #1a5fb4; color: #fff; border: 0; }
    input:focus, button:focus { outline: none; }
  </style>
</head>
<body>
  <main>
    <h1>Checkout</h1>
    <form>
      <input type="text" placeholder="Full name">
      <input type="email" placeholder="Email">
      <input type="text" placeholder="Postal code">
      <p class="hint">We only use your email for order updates.</p>
      <button type="submit">Place order</button>
    </form>
  </main>
</body>
</html>
