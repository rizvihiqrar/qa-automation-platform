name: Dashboard

# Rebuilds the CI dashboard after every CI run on main (including the nightly
# one) and publishes it to GitHub Pages.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The run that triggered this one; a manual run uses the latest CI run on main.
      - name: Download test reports from the CI run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          [ -n "$RUN_ID" ] || RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --status completed --limit 1 --json databaseId -q '.[0].databaseId')
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -p 'report-*' -D reports-raw || echo "No reports to download"

      # Reports are scanned before publishing: tokens redacted, zipped data with a
      # token withheld (packages/ci-dashboard/src/reports.js). The traceability matrix
      # joins the test plan with qa-practice-api's results (src/traceability.js).
      - name: Build dashboard, reports and traceability matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node packages/ci-dashboard/src/build.js --out _site --reports reports-raw --reports-run "$RUN_ID" --plan docs/test-strategy/test-plan.md

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
