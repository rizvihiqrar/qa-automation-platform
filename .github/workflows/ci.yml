name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled: adding the full-regression label reruns CI with the full suites
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '0 9 * * *'   # nightly regression, 09:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Type-check packages
        run: npm run typecheck -- --install
      - name: Test root scripts
        run: npm test

  test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Unit and integration
          - { package: test-data-factory,        browsers: false, command: npm test }
          - { package: sql-data-integrity,       browsers: false, command: npm test && npm run check }
          - { package: defect-report-linter,     browsers: false, command: npm test }
          - { package: webhook-harness,          browsers: false, command: npm test && npm run demo }
          - { package: log-signature-grouper,    browsers: false, command: npm test }
          - { package: api-drift-checker,        browsers: false, command: npm ci --prefix ../qa-practice-api && npm test && npm run check:live }
          - { package: exploratory-session-tracker, browsers: false, command: npm test && npm run debrief }
          - { package: k6-performance,           browsers: false, k6: true, command: npm ci --prefix ../qa-practice-api && npm test && npm run perf:ci }
          - { package: release-gate,             browsers: false, command: npm test }
          - { package: a11y-aoda-audit,          browsers: true,  command: npm test && npm run audit }
          - { package: ci-dashboard,             browsers: false, command: npm test }
          - { package: flaky-test-analyzer,      browsers: false, command: npm test }
          - { package: worker-scaling-benchmark, browsers: false, command: npm test }
          - { package: matrix-build-demo,        browsers: false, command: npm test }
          - { package: pipeline-templates-demo,  browsers: false, command: npm run lint && npm test }
          - { package: mutation-testing-demo,    browsers: false, command: npm test && npm run test:mutation }
          # API
          - { package: qa-practice-api,          browsers: false, command: npm test }
          - { package: graphql-test-suite,       browsers: false, command: npm test }
          - { package: postman-api-collection,   browsers: false, command: npm test }
          - { package: contract-testing-demo,    browsers: false, command: npm test }
          - { package: qa-for-ai-features,       browsers: false, command: npx playwright test }
          # Browser, against the live Sauce Demo site. `smoke` is what a pull request
          # runs when it doesn't touch the suite (scripts/test-scope.mjs decides).
          - { package: multi-user-flow-patterns, browsers: true,  command: npm test, smoke: npm run smoke }
          - { package: bdd-playwright-demo,      browsers: true,  command: npm run test:guard && npm test, smoke: npm run test:guard && npm run smoke }
          - { package: ai-test-generator,        browsers: true,  command: npm test && npm run review && npm run test:e2e, smoke: npm test && npm run review && npm run test:e2e -- --grep @smoke }
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the PR merge commit and its base, to list changed files

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/${{ matrix.package }}/package-lock.json

      - name: Choose smoke or full
        id: scope
        if: matrix.smoke
        run: node ../../scripts/test-scope.mjs ${{ matrix.package }}

      - run: npm ci

      - name: Install Playwright browser
        if: matrix.browsers
        run: npx playwright install --with-deps chromium

      - name: Install k6
        if: matrix.k6
        uses: grafana/setup-k6-action@v1

      - name: Test
        run: ${{ steps.scope.outputs.scope == 'smoke' && matrix.smoke || matrix.command }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.package }}
          path: |
            packages/${{ matrix.package }}/playwright-report/
            packages/${{ matrix.package }}/reports/
          if-no-files-found: ignore
          retention-days: 7

  # Sauce Demo regression (43 AI-generated tests, ai-test-generator/tests/regression),
  # split across runners. Each shard uploads a blob report; regression-report merges
  # them into one HTML report and checks every listed test ran exactly once.
  # Full suite: 3 shards. Smoke (a PR that doesn't touch the suite): the 10 @smoke
  # tests on 1 shard. To change the shard count, edit both lists in `shards` and
  # `total` below.
  regression-scope:
    name: regression scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        run: node scripts/test-scope.mjs ai-test-generator

  regression:
    name: regression (shard ${{ matrix.shard }}/${{ matrix.total }})
    needs: regression-scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GREP: ${{ needs.regression-scope.outputs.scope == 'smoke' && '@smoke' || '' }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.regression-scope.outputs.scope == 'smoke' && '[1]' || '[1, 2, 3]') }}
        total: ${{ fromJSON(needs.regression-scope.outputs.scope == 'smoke' && '[1]' || '[3]') }}
    defaults:
      run:
        working-directory: packages/ai-test-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/ai-test-generator/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test shard
        run: npx playwright test -c playwright.regression.config.js --shard=${{ matrix.shard }}/${{ matrix.total }} --reporter=blob ${GREP:+--grep "$GREP"}
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: packages/ai-test-generator/blob-report
          retention-days: 1

  regression-report:
    name: regression report
    needs: [regression-scope, regression]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GREP: ${{ needs.regression-scope.outputs.scope == 'smoke' && '@smoke' || '' }}
    defaults:
      run:
        working-directory: packages/ai-test-generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/ai-test-generator/package-lock.json
      - run: npm ci   # no browser needed: listing and merging don't launch one
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: packages/ai-test-generator/all-blob-reports
          merge-multiple: true
      - name: Merge shard reports
        run: npx playwright merge-reports -c playwright.regression.config.js --reporter html,json all-blob-reports
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged.json
      - name: Check every test ran exactly once
        run: |
          # Listed with the same --grep as the shards, so a smoke run is checked against the smoke set.
          npx playwright test -c playwright.regression.config.js --list --reporter=json ${GREP:+--grep "$GREP"} > list.json
          node src/shardCheckCli.ts list.json merged.json --shards "$(ls all-blob-reports/*.zip | wc -l)"
      - name: Upload merged report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-regression
          path: packages/ai-test-generator/playwright-report/
          retention-days: 7
      # The Flaky tests workflow reads these from the last 14 runs on main.
      # Only full runs: a smoke run would look like 33 tests went missing.
      - name: Upload merged results
        if: ${{ !cancelled() && needs.regression-scope.outputs.scope == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: regression-results
          path: packages/ai-test-generator/merged.json
          if-no-files-found: ignore
          retention-days: 30
