name: CI health

# Reads the latest run of every workflow on main in each watched repo
# (scripts/ci-health.mjs) and keeps one issue (label ci-health) open while
# anything is failing, a scheduled workflow is overdue, or a run on main needed a
# re-run that no merged fix names yet.
# Daily, after the nightly CI run: a new comment each day the issue stays open, so
# the reminder keeps arriving by email, and the full report (pass rates per
# workflow and package) on the "Daily CI status" issue, which stays closed: GitHub
# still emails comments on a closed issue to anyone watching the repo or subscribed
# to it, and the repo shows no open issues while everything is green.
# After every CI run on main: only refreshes the open issue's body or closes it, so
# a merged fix clears the issue within minutes, without extra emails.
on:
  schedule:
    - cron: '45 9 * * *' # 09:45 UTC, after the 09:00 nightly CI
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read # merged PRs that name a re-run as fixed

concurrency:
  group: ci-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DAILY: ${{ github.event_name != 'workflow_run' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check every workflow
        id: check
        continue-on-error: true # a problem is reported through the issue below
        run: node scripts/ci-health.mjs --out ci-health.md

      - name: Job summary
        run: cat ci-health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the ci-health issue
        env:
          PROBLEMS: ${{ steps.check.outcome == 'failure' }}
        run: |
          gh label create ci-health --color B60205 --description "A workflow on main is failing or overdue" --force
          open=$(gh issue list --label ci-health --state open --json number -q '.[0].number')
          if [ "$PROBLEMS" = "true" ]; then
            if [ -z "$open" ]; then
              gh issue create --title "CI health: a workflow on main needs attention" --label ci-health --body-file ci-health.md
            else
              # The body shows the latest report: whatever opened the issue (often a CI
              # recheck diagnosis) may be fixed by now, and the body is what people read first.
              gh issue edit "$open" --body-file ci-health.md
              if [ "$DAILY" = "true" ]; then gh issue comment "$open" --body-file ci-health.md; fi
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "$(printf 'All green again.\n\n'; cat ci-health.md)"
          fi

      # The daily status email, green or not: one issue (label ci-status), kept closed,
      # gets the full report as a comment each day, and GitHub emails each comment.
      - name: Post the daily status
        if: ${{ github.event_name != 'workflow_run' }}
        run: |
          gh label create ci-status --color 0E8A16 --description "Daily CI status report" --force
          status=$(gh issue list --label ci-status --state all --json number -q '.[0].number')
          if [ -z "$status" ]; then
            # Use the URL gh prints: issue search lags a few seconds behind a new issue.
            status=$(gh issue create --title "Daily CI status" --label ci-status --body "Each day CI health adds a comment here with every workflow and package, green or not, so the status arrives by email. The issue stays closed on purpose: it is a log, not a problem.")
          fi
          gh issue comment "$status" --body-file ci-health.md
          if [ "$(gh issue view "$status" --json state -q .state)" = "OPEN" ]; then
            gh issue close "$status" --reason "not planned" --comment "Closed on purpose: this issue is a log of the daily CI report, not a problem. Comments keep arriving by email."
          fi
