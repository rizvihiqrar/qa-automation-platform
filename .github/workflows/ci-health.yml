name: CI health

# Daily, after the nightly CI run: reads the latest run of every workflow on main
# in each watched repo (scripts/ci-health.mjs) and keeps one issue (label
# ci-health) open while anything is failing or a scheduled workflow is overdue.
# A new comment is added each day it stays that way, so the reminder keeps
# arriving by email; the issue is closed when everything is green again.
# Separately, the full report (pass rates per workflow and package) is posted to
# the "Daily CI status" issue every day, so a status email arrives even when green.
on:
  schedule:
    - cron: '45 9 * * *' # 09:45 UTC, after the 09:00 nightly CI
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ci-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check every workflow
        id: check
        continue-on-error: true # a problem is reported through the issue below
        run: node scripts/ci-health.mjs --out ci-health.md

      - name: Job summary
        run: cat ci-health.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open, update or close the ci-health issue
        env:
          PROBLEMS: ${{ steps.check.outcome == 'failure' }}
        run: |
          gh label create ci-health --color B60205 --description "A workflow on main is failing or overdue" --force
          open=$(gh issue list --label ci-health --state open --json number -q '.[0].number')
          if [ "$PROBLEMS" = "true" ]; then
            if [ -z "$open" ]; then
              gh issue create --title "CI health: a workflow on main needs attention" --label ci-health --body-file ci-health.md
            else
              gh issue comment "$open" --body-file ci-health.md
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "$(printf 'All green again.\n\n'; cat ci-health.md)"
          fi

      # The daily status email, green or not: one long-lived issue (label ci-status)
      # gets the full report as a comment each day, and GitHub emails each comment.
      - name: Post the daily status
        run: |
          gh label create ci-status --color 0E8A16 --description "Daily CI status report" --force
          status=$(gh issue list --label ci-status --state open --json number -q '.[0].number')
          if [ -z "$status" ]; then
            # Use the URL gh prints: issue search lags a few seconds behind a new issue.
            status=$(gh issue create --title "Daily CI status" --label ci-status --body "Each day CI health adds a comment here with every workflow and package, green or not, so the status arrives by email.")
          fi
          gh issue comment "$status" --body-file ci-health.md
