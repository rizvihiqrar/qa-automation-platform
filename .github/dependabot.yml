# New advisories land in dependencies we do not choose (body-parser through express, node-forge
# through promptfoo). The Dependency audit step fails CI when one does, on the 2026-10-24 and
# 2026-10-25 scheduled runs. Dependabot opens the lockfile bump as a pull request, so the fix
# arrives as a PR instead of waiting for someone to read a red run. Two open at a time keeps CI free.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/tools/*", "/packages/*"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      # OpenTelemetry packages version in lockstep (an exporter release needs the matching api, core
      # and SDK packages), so they move in one pull request or not at all.
      opentelemetry:
        patterns: ["@opentelemetry/*"]
      npm-minor-and-patch:
        update-types: [minor, patch]
    # CI runs Node 24. The types must stay on the runtime's major version: Node 26 types
    # describe APIs Node 24 does not have, and the compile-only checks would still pass.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Held back on purpose (pull request 137, 2026-11-04): the 0.300 exporters need api 1.10 and
      # sdk-trace 3, but the newest sdk-trace-node (2.12.0) still needs api below 1.10, so npm ci
      # fails with ERESOLVE. A new major of resources or sdk-metrics would break the same way.
      # Remove these three entries once sdk-trace-node 3 is published.
      - dependency-name: "@opentelemetry/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"]
      - dependency-name: "@opentelemetry/exporter-*"
        versions: [">=0.300.0"]
  - package-ecosystem: pip
    directories:
      - "/packages/api-pytest"
      - "/packages/hcm-conversion-validation"
    ignore:
      # Pinned on purpose: the committed legacy extract in hcm-conversion-validation is Faker's
      # output from seed 51, checked byte for byte in every test run, so a new Faker means new
      # names and new expected counts. Upgrade it by hand with python -m hcm_conv generate.
      - dependency-name: "Faker"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
