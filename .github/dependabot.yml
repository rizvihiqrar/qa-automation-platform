# New advisories land in dependencies we do not choose (body-parser through express, node-forge
# through promptfoo). The Dependency audit step fails CI when one does, on the 2026-10-24 and
# 2026-10-25 scheduled runs. Dependabot opens the lockfile bump as a pull request, so the fix
# arrives as a PR instead of waiting for someone to read a red run. Two open at a time keeps CI free.
version: 2
updates:
  - package-ecosystem: npm
    directories: ["/", "/tools/*", "/packages/*"]
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # CI runs Node 24. The types must stay on the runtime's major version: Node 26 types
    # describe APIs Node 24 does not have, and the compile-only checks would still pass.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: pip
    directories:
      - "/packages/api-pytest"
      - "/packages/hcm-conversion-validation"
    ignore:
      # Pinned on purpose: the committed legacy extract in hcm-conversion-validation is Faker's
      # output from seed 51, checked byte for byte in every test run, so a new Faker means new
      # names and new expected counts. Upgrade it by hand with python -m hcm_conv generate.
      - dependency-name: "Faker"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
